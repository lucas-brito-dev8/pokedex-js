<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Pokédex</h1>

        <div class="search-box">
            <input type="text" id="pokemonInput" placeholder="Type a Pokémon...">

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div class="loading" id="loading">
            Loading...
        </div>

        <div class="error" id="error">
            Pokémon not found.
        </div>

        <div class="pokemon-card" id="pokemonCard">

            <img id="pokemonImage" src="" alt="Pokemon">

            <h2 id="pokemonName"></h2>

            <div class="info">
                <p id="pokemonType"></p>

                <p id="pokemonHeight"></p>

                <p id="pokemonWeight"></p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
